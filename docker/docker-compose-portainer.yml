services:
  gestion-pagos:
    image: mbraut/gestion-pagos:2.2.0   # Cambia a :latest para recibir actualizaciones automáticas
    container_name: gestion-pagos
    ports:
      - "8080:80"
    volumes:
      - gestion-pagos-data:/var/www/html/data
    restart: unless-stopped

volumes:
  gestion-pagos-data:
    # Volumen nombrado gestionado por Docker.
    # Persiste base de datos, servicios, tema, config Telegram y backups.
    # Al actualizar la imagen, los datos se conservan intactos.
