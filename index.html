<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Pagos - Servicios</title>
    <link rel="icon" href="share/favicon/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/common.css">
    <script src="https://code.iconify.design/iconify-icon/2.1.0/iconify-icon.min.js"></script>
    <script src="assets/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="hero-header">
            <img src="gestion_pagos.png" alt="Gestión de Pagos" class="hero-img">
            <div class="hero-overlay"></div>
            <div class="hero-actions">
                <div class="hero-buttons">
                    <button onclick="shareResumen()" class="btn btn-small hero-btn">
                        <iconify-icon icon="mdi:share-variant" width="16" height="16"></iconify-icon>
                        <span>Compartir</span>
                    </button>
                    <button onclick="exportToCSV()" class="btn btn-small hero-btn">
                        <iconify-icon icon="mdi:file-export" width="16" height="16"></iconify-icon>
                        <span data-i18n="nav.export_csv">Exportar CSV</span>
                    </button>
                    <a href="admin.html" class="btn btn-small hero-btn" style="text-decoration:none;">
                        <iconify-icon icon="mdi:cog" width="16" height="16"></iconify-icon>
                        <span data-i18n="nav.admin">Admin</span>
                    </a>
                </div>
                <div id="themeToggle" class="theme-toggle-group"></div>
            </div>
        </div>

        <div class="dashboard">
            <div class="stat-card">
                <div class="stat-card-icon"><iconify-icon icon="mdi:scale-balance" width="24" height="24"></iconify-icon></div>
                <div class="stat-card-body">
                    <div class="stat-label" data-i18n="dashboard.current_balance">Saldo Actual</div>
                    <div class="stat-description" id="balanceDescription" data-i18n="dashboard.fetching">Obteniendo datos...</div>
                </div>
                <div class="stat-value" id="currentBalance" data-i18n="dashboard.loading">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon"><iconify-icon icon="mdi:clock-outline" width="24" height="24"></iconify-icon></div>
                <div class="stat-card-body">
                    <div class="stat-label" data-i18n="dashboard.total_worked">Total Trabajado</div>
                    <div class="stat-description" id="totalHours" data-i18n="dashboard.calculating">Calculando...</div>
                </div>
                <div class="stat-value neutral" id="totalWorked" data-i18n="dashboard.loading">—</div>
            </div>
            <div class="stat-card">
                <div class="stat-card-icon"><iconify-icon icon="mdi:cash-check" width="24" height="24"></iconify-icon></div>
                <div class="stat-card-body">
                    <div class="stat-label" data-i18n="dashboard.total_paid">Total Pagado</div>
                    <div class="stat-description" id="lastPayment" data-i18n="dashboard.no_data">Sin datos</div>
                </div>
                <div class="stat-value neutral" id="totalPaid" data-i18n="dashboard.loading">—</div>
            </div>
        </div>

        <div id="nextPaymentAlert" class="alert alert-info"></div>

        <div class="main-grid">
            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><iconify-icon icon="mdi:clipboard-edit" width="24" height="24"></iconify-icon> <span data-i18n="forms.register_work">Registrar Trabajo</span></h2>
                </div>
                <form id="workForm">
                    <div class="form-group">
                        <label for="workService" data-i18n="forms.service">Servicio</label>
                        <select id="workService" required></select>
                    </div>
                    <div class="form-group">
                        <label for="workDate" data-i18n="forms.date">Fecha</label>
                        <input type="date" id="workDate" required>
                    </div>
                    <div class="form-group">
                        <label for="workHours" data-i18n="forms.hours_worked">Horas trabajadas</label>
                        <input type="number" id="workHours" step="0.5" min="0.5" required placeholder="6">
                    </div>
                    <div class="form-group">
                        <label for="workNotes" data-i18n="forms.notes_optional">Notas (opcional)</label>
                        <input type="text" id="workNotes" data-i18n-placeholder="forms.placeholder_notes_work" placeholder="Ej: Limpieza profunda">
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;" data-i18n="forms.btn_register_work">Registrar Trabajo</button>
                </form>
            </div>

            <div class="card">
                <div class="card-header">
                    <h2 class="card-title"><iconify-icon icon="mdi:cash-multiple" width="24" height="24"></iconify-icon> <span data-i18n="forms.register_payment">Registrar Pago</span></h2>
                </div>
                <form id="paymentForm">
                    <div class="form-group">
                        <label for="paymentService" data-i18n="forms.service">Servicio</label>
                        <select id="paymentService" required></select>
                    </div>
                    <div class="form-group">
                        <label for="paymentDate" data-i18n="forms.payment_date">Fecha del pago</label>
                        <input type="date" id="paymentDate" required>
                    </div>
                    <div class="form-group">
                        <label for="paymentAmount"><span data-i18n="forms.amount_paid">Cantidad pagada</span> (&euro;)</label>
                        <input type="number" id="paymentAmount" step="0.01" min="0" required placeholder="72.00">
                    </div>
                    <div class="form-group">
                        <label for="paymentNotes" data-i18n="forms.notes_optional">Notas (opcional)</label>
                        <input type="text" id="paymentNotes" data-i18n-placeholder="forms.placeholder_notes_payment" placeholder="Ej: No habia cambio">
                    </div>
                    <button type="submit" class="btn btn-secondary" style="width: 100%;" data-i18n="forms.btn_register_payment">Registrar Pago</button>
                </form>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><iconify-icon icon="mdi:chart-line" width="24" height="24"></iconify-icon> <span data-i18n="chart.title">Evolucion del Saldo</span></h2>
                <div class="chart-controls">
                    <div class="service-selector service-selector-sm" id="chartServiceSelector">
                        <button class="service-btn active" data-service="all" data-i18n="chart.all">Todos</button>
                    </div>
                    <div class="chart-period-sep"></div>
                    <div class="service-selector service-selector-sm" id="chartPeriodSelector">
                        <button class="service-btn active" data-period="month">Este mes</button>
                        <button class="service-btn" data-period="1m">1m</button>
                        <button class="service-btn" data-period="3m">3m</button>
                        <button class="service-btn" data-period="6m">6m</button>
                        <button class="service-btn" data-period="all">Todo</button>
                    </div>
                </div>
            </div>
            <div class="chart-container">
                <canvas id="balanceChart"></canvas>
            </div>
        </div>

        <!-- Resumen mensual -->
        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><iconify-icon icon="mdi:calendar-month" width="24" height="24"></iconify-icon> Resumen Mensual</h2>
                <div class="service-selector" id="summaryServiceSelector">
                    <button class="service-btn active" data-summary-service="all">Todos</button>
                </div>
            </div>
            <div class="history-date-filter">
                <iconify-icon icon="mdi:calendar-range" width="16" height="16" style="color:var(--text-secondary)"></iconify-icon>
                <input type="date" id="summaryDateFrom" onchange="renderMonthlySummary()" title="Desde (filtro personalizado)">
                <span style="color:var(--text-secondary); font-size:0.8rem;">—</span>
                <input type="date" id="summaryDateTo" onchange="renderMonthlySummary()" title="Hasta (filtro personalizado)">
                <div class="service-selector service-selector-sm history-presets" id="summaryPresets">
                    <button class="service-btn" data-months="3" onclick="setSummaryPreset(3)">3 meses</button>
                    <button class="service-btn" data-months="6" onclick="setSummaryPreset(6)">6 meses</button>
                    <button class="service-btn" data-months="12" onclick="setSummaryPreset(12)">1 año</button>
                </div>
                <span id="summaryCount" class="history-count"></span>
            </div>
            <div id="monthlySummaryContainer"></div>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title"><iconify-icon icon="mdi:clipboard-text-clock" width="24" height="24"></iconify-icon> <span data-i18n="history.title">Historial de Movimientos</span></h2>
                <div class="service-selector">
                    <button class="service-btn active" data-filter="all" data-i18n="history.all">Todos</button>
                    <!-- Dynamic filter buttons will be populated by JS -->
                    <button class="service-btn" data-filter="work" data-i18n="history.works">Trabajos</button>
                    <button class="service-btn" data-filter="payment" data-i18n="history.payments">Pagos</button>
                </div>
            </div>
            <div class="history-date-filter">
                <iconify-icon icon="mdi:calendar-range" width="16" height="16" style="color:var(--text-secondary)"></iconify-icon>
                <input type="date" id="historyDateFrom" placeholder="Desde" onchange="renderHistory()" title="Desde (filtro personalizado)">
                <span style="color:var(--text-secondary); font-size:0.8rem;">—</span>
                <input type="date" id="historyDateTo" placeholder="Hasta" onchange="renderHistory()" title="Hasta (filtro personalizado)">
                <div class="service-selector service-selector-sm history-presets" id="historyPresets">
                    <button class="service-btn" data-months="1" onclick="setHistoryPreset(1)">1 mes</button>
                    <button class="service-btn" data-months="3" onclick="setHistoryPreset(3)">3 meses</button>
                    <button class="service-btn" data-months="6" onclick="setHistoryPreset(6)">6 meses</button>
                    <button class="service-btn" data-months="12" onclick="setHistoryPreset(12)">1 año</button>
                </div>
                <span id="historyCount" class="history-count"></span>
            </div>
            <div id="historyContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <p data-i18n="history.loading">Cargando movimientos...</p>
                </div>
            </div>
        </div>
    </div>


    <script>
        // Configuración de la API
        const API_BASE = 'api/records.php';

        // Estado de la aplicación
        let records = [];
        let services = [];
        let currentFilter = 'all';
        let currentChartService = 'all';
        let currentChartPeriod = 'month';
        let currentSummaryService = 'all';
        let balanceChart = null;

        // Inicialización
        document.addEventListener('DOMContentLoaded', async () => {
            await App.init();
            loadServices();
            loadData();
            initializeForms();
            setDefaultDates();

            // Re-render on language change
            document.addEventListener('langChanged', () => {
                updateDashboard();
                renderHistory();
                renderMonthlySummary();
                renderChartServiceButtons();
                renderHistoryFilterButtons();
                renderSummaryServiceButtons();
            });
        });

        // Cargar servicios
        async function loadServices() {
            try {
                const response = await fetch('api/admin.php?action=getServices');
                const result = await response.json();

                if (result.success) {
                    services = result.data;
                    populateServiceSelectors();
                }
            } catch (error) {
                console.error('Error cargando servicios:', error);
                // Servicios por defecto si falla
                services = [
                    {name: 'Limpieza', rate: 12},
                    {name: 'Jardinero', rate: 15}
                ];
                populateServiceSelectors();
            }
        }

        // Poblar selectores de servicios
        function populateServiceSelectors() {
            const workSelect = document.getElementById('workService');
            const paymentSelect = document.getElementById('paymentService');

            const options = services.map(s => {
                return `<option value="${s.name}">${s.name}</option>`;
            }).join('');

            workSelect.innerHTML = options;
            paymentSelect.innerHTML = options;

            renderChartServiceButtons();
            renderHistoryFilterButtons();
            renderSummaryServiceButtons();
        }

        // Obtener icono de servicio
        function getServiceIcon(name) {
            return App.icons.getServiceIcon(name);
        }

        // Renderizar botones de servicio y período del gráfico
        function renderChartServiceButtons() {
            const svc = document.getElementById('chartServiceSelector');
            if (!svc) return;

            svc.innerHTML = `<button class="service-btn ${currentChartService === 'all' ? 'active' : ''}" data-service="all">${App.t('chart.all')}</button>` +
                services.map(s => `<button class="service-btn ${currentChartService === s.name ? 'active' : ''}" data-service="${s.name}">${s.name}</button>`).join('');

            svc.querySelectorAll('[data-service]').forEach(btn => {
                btn.addEventListener('click', () => {
                    svc.querySelectorAll('[data-service]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentChartService = btn.dataset.service;
                    renderChart();
                });
            });

            const per = document.getElementById('chartPeriodSelector');
            if (!per) return;

            per.querySelectorAll('[data-period]').forEach(btn => {
                btn.addEventListener('click', () => {
                    per.querySelectorAll('[data-period]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentChartPeriod = btn.dataset.period;
                    renderChart();
                });
            });
        }

        // Renderizar botones de filtro del historial
        function renderHistoryFilterButtons() {
            const container = document.querySelector('[data-filter="all"]')?.parentElement;
            if (!container) return;

            container.innerHTML = `<button class="service-btn active" data-filter="all">${App.t('history.all')}</button>` +
                services.map(s => `<button class="service-btn" data-filter="${s.name}">${s.name}</button>`).join('') +
                `<button class="service-btn" data-filter="work">${App.t('history.works')}</button>` +
                `<button class="service-btn" data-filter="payment">${App.t('history.payments')}</button>`;

            container.querySelectorAll('[data-filter]').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('[data-filter]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentFilter = btn.dataset.filter;
                    renderHistory();
                });
            });
        }

        // Cargar datos desde el servidor
        async function loadData() {
            try {
                const response = await fetch(`${API_BASE}?path=records`);
                const result = await response.json();

                if (result.success) {
                    records = result.data;
                    updateDashboard();
                    renderHistory();
                    renderMonthlySummary();
                    renderChart();
                } else {
                    showAlert('Error al cargar datos: ' + result.error, 'error');
                }
            } catch (error) {
                console.error('Error:', error);
                showAlert(App.t('alerts.connection_error'), 'error');
            }
        }

        // Establecer fechas por defecto
        function setDefaultDates() {
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('workDate').value = today;
            document.getElementById('paymentDate').value = today;
            // Historial: por defecto, solo el último mes
            document.getElementById('historyDateFrom').value = localISODate(monthsAgo(1));
            // Resumen mensual: por defecto, el último año (12 meses completos incluido el actual)
            document.getElementById('summaryDateFrom').value = localISODate(summaryPresetStart(12));
        }

        // Primer día del mes que deja N meses completos contando el actual
        function summaryPresetStart(n) {
            const now = new Date();
            return new Date(now.getFullYear(), now.getMonth() - (n - 1), 1);
        }

        function localISODate(d) {
            return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
        }

        function monthsAgo(n) {
            const d = new Date();
            d.setMonth(d.getMonth() - n);
            return d;
        }

        function escapeHtml(str) {
            return String(str ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        // Inicializar formularios
        function initializeForms() {
            document.getElementById('workForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const selectedService = services.find(s => s.name === document.getElementById('workService').value);
                const data = {
                    service: document.getElementById('workService').value,
                    date: document.getElementById('workDate').value,
                    hours: parseFloat(document.getElementById('workHours').value),
                    rate: selectedService?.rate || 0,
                    notes: document.getElementById('workNotes').value
                };

                try {
                    const response = await fetch(`${API_BASE}?path=work`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (result.success) {
                        showAlert(App.t('alerts.work_registered'), 'success');
                        e.target.reset();
                        setDefaultDates();
                        loadData();
                    } else {
                        showAlert('Error: ' + result.error, 'error');
                    }
                } catch (error) {
                    showAlert(App.t('alerts.connection_error'), 'error');
                }
            });

            document.getElementById('paymentForm').addEventListener('submit', async (e) => {
                e.preventDefault();

                const data = {
                    service: document.getElementById('paymentService').value,
                    date: document.getElementById('paymentDate').value,
                    amount: parseFloat(document.getElementById('paymentAmount').value),
                    notes: document.getElementById('paymentNotes').value
                };

                try {
                    const response = await fetch(`${API_BASE}?path=payment`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(data)
                    });

                    const result = await response.json();

                    if (result.success) {
                        showAlert(App.t('alerts.payment_registered'), 'success');
                        e.target.reset();
                        setDefaultDates();
                        loadData();
                    } else {
                        showAlert('Error: ' + result.error, 'error');
                    }
                } catch (error) {
                    showAlert(App.t('alerts.connection_error'), 'error');
                }
            });
        }

        // Filters are initialized dynamically in renderChartServiceButtons() and renderHistoryFilterButtons()

        // Calcular saldo
        function calculateBalance(serviceFilter = null) {
            let balance = 0;
            let totalWorked = 0;
            let totalPaid = 0;
            let totalHours = 0;

            const filteredRecords = serviceFilter
                ? records.filter(r => r.service === serviceFilter)
                : records;

            filteredRecords.forEach(record => {
                if (record.type === 'work') {
                    const t = parseFloat(record.total) || 0;
                    const h = parseFloat(record.hours) || 0;
                    balance -= t;
                    totalWorked += t;
                    totalHours += h;
                } else if (record.type === 'payment') {
                    const a = parseFloat(record.amount) || 0;
                    balance += a;
                    totalPaid += a;
                }
            });

            // Redondear a 2 decimales para evitar errores de coma flotante acumulados
            return {
                balance:     Math.round(balance     * 100) / 100,
                totalWorked: Math.round(totalWorked * 100) / 100,
                totalPaid:   Math.round(totalPaid   * 100) / 100,
                totalHours:  Math.round(totalHours  * 100) / 100
            };
        }

        // Actualizar dashboard
        function updateDashboard() {
            const { balance, totalWorked, totalPaid, totalHours } = calculateBalance();

            // Saldo actual
            const balanceEl = document.getElementById('currentBalance');
            balanceEl.textContent = formatCurrency(Math.abs(balance));

            if (balance < 0) {
                balanceEl.className = 'stat-value negative';
                document.getElementById('balanceDescription').textContent = App.t('dashboard.pending_payment');
            } else if (balance > 0) {
                balanceEl.className = 'stat-value positive';
                document.getElementById('balanceDescription').textContent = App.t('dashboard.overpaid');
            } else {
                balanceEl.className = 'stat-value neutral';
                document.getElementById('balanceDescription').textContent = App.t('dashboard.up_to_date');
            }

            // Total trabajado
            document.getElementById('totalWorked').textContent = formatCurrency(totalWorked);
            document.getElementById('totalHours').textContent = `${totalHours.toFixed(1)} ${App.t('dashboard.hours_worked')}`;

            // Total pagado
            document.getElementById('totalPaid').textContent = formatCurrency(totalPaid);

            const lastPaymentRecord = records
                .filter(r => r.type === 'payment')
                .sort((a, b) => new Date(b.date) - new Date(a.date))[0];

            if (lastPaymentRecord) {
                document.getElementById('lastPayment').textContent =
                    `${App.t('dashboard.last_payment')}: ${formatDate(lastPaymentRecord.date)}`;
            } else {
                document.getElementById('lastPayment').textContent = App.t('dashboard.no_payments');
            }

            // Alerta de próximo pago
            if (balance < 0) {
                const alert = document.getElementById('nextPaymentAlert');
                alert.innerHTML = `<strong>${App.t('alerts.next_payment_suggested')}:</strong> ${formatCurrency(Math.abs(balance))} (${App.t('alerts.accumulated_debt')})`;
                alert.style.display = 'block';
                alert.className = 'alert alert-warning';
            } else if (balance > 0) {
                const alert = document.getElementById('nextPaymentAlert');
                alert.innerHTML = `<strong>${App.t('alerts.next_payment')}:</strong> ${App.t('alerts.discount_next', { amount: formatCurrency(balance) })}`;
                alert.style.display = 'block';
                alert.className = 'alert alert-info';
            } else {
                document.getElementById('nextPaymentAlert').style.display = 'none';
            }
        }

        // Renderizar historial (formato compacto: una línea por movimiento)
        function renderHistory() {
            const container = document.getElementById('historyContainer');
            const countEl   = document.getElementById('historyCount');

            // 1) El saldo se calcula SIEMPRE sobre el historial completo (solo filtrado por servicio),
            //    para que no se "reinicie" a 0 al filtrar por fechas o por tipo.
            const isTypeFilter = currentFilter === 'work' || currentFilter === 'payment';
            const base = (currentFilter === 'all' || isTypeFilter)
                ? records
                : records.filter(r => r.service === currentFilter);

            const sorted = [...base].sort((a, b) => {
                const d = new Date(a.date) - new Date(b.date);
                return d !== 0 ? d : new Date(a.created_at) - new Date(b.created_at);
            });

            let running = 0;
            let withBalance = sorted.map(record => {
                const balanceBefore = running;
                if (record.type === 'work') {
                    running -= parseFloat(record.total) || 0;
                } else {
                    running += parseFloat(record.amount) || 0;
                }
                running = Math.round(running * 100) / 100;
                return { ...record, balanceBefore, balanceAfter: running };
            });

            // 2) Filtros de visualización: tipo y fechas
            if (isTypeFilter) withBalance = withBalance.filter(r => r.type === currentFilter);
            const totalInFilter = withBalance.length;
            const dateFrom = document.getElementById('historyDateFrom')?.value;
            const dateTo   = document.getElementById('historyDateTo')?.value;
            if (dateFrom) withBalance = withBalance.filter(r => r.date >= dateFrom);
            if (dateTo)   withBalance = withBalance.filter(r => r.date <= dateTo);

            // Marcar el botón predefinido activo (si las fechas coinciden con uno)
            document.querySelectorAll('#historyPresets [data-months]').forEach(btn => {
                const n = parseInt(btn.dataset.months, 10);
                btn.classList.toggle('active', !dateTo && dateFrom === localISODate(monthsAgo(n)));
            });

            if (countEl) {
                const anyFilter = dateFrom || dateTo || currentFilter !== 'all';
                countEl.innerHTML = (dateFrom || dateTo) && withBalance.length < totalInFilter
                    ? `<span>${withBalance.length} de ${totalInFilter}</span>`
                    : `<span>${withBalance.length} movimientos</span>`;
                if (anyFilter) {
                    countEl.innerHTML += `<button class="service-btn" onclick="clearAllHistoryFilters()" title="Quitar todos los filtros"><iconify-icon icon="mdi:eye-outline" width="14" height="14"></iconify-icon> Ver todos</button>`;
                }
            }

            if (withBalance.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon"><iconify-icon icon="mdi:inbox-outline" width="48" height="48"></iconify-icon></div>
                        <p>${App.t('history.empty')}</p>
                    </div>
                `;
                return;
            }

            // Mostrar más reciente primero
            withBalance.reverse();

            container.innerHTML = withBalance.map(record => {
                const isWork = record.type === 'work';
                const total  = parseFloat(isWork ? record.total : record.amount) || 0;

                const detail = isWork
                    ? `<span class="hr-detail" title="Horas trabajadas × precio/hora = coste del trabajo">
                           <span class="hr-kind">Horas:</span> ${record.hours}h × ${formatCurrency(parseFloat(record.rate) || 0)} = <strong>${formatCurrency(total)}</strong>
                       </span>`
                    : `<span class="hr-detail" title="Pago recibido">
                           <span class="hr-kind">Pago:</span> <strong class="hr-pay">+${formatCurrency(total)}</strong>
                       </span>`;

                const notes = record.notes
                    ? `<span class="hr-notes" title="${escapeHtml(record.notes)}"><iconify-icon icon="mdi:note-text" width="13" height="13"></iconify-icon>${escapeHtml(record.notes)}</span>`
                    : '';

                return `
                    <div class="history-row ${isWork ? 'work' : 'payment'}" id="hi-${record.id}">
                        <span class="hr-date">${formatDate(record.date)}</span>
                        <span class="history-type ${isWork ? 'work' : 'payment'}">${escapeHtml(record.service)}</span>
                        <span class="hr-main">${detail}${notes}</span>
                        ${renderBalanceRow(record)}
                        <span class="hr-actions">
                            <button class="btn-edit" onclick="openEditModal(${record.id})" title="Editar">
                                <iconify-icon icon="mdi:pencil" width="14" height="14"></iconify-icon>
                            </button>
                            <button class="btn-delete" onclick="deleteRecord(${record.id})" title="Eliminar">
                                <iconify-icon icon="mdi:trash-can-outline" width="14" height="14"></iconify-icon>
                            </button>
                        </span>
                    </div>
                `;
            }).join('');
        }

        // Saldo compacto: "antes → después" (el desglose completo va en el tooltip)
        function renderBalanceRow(record) {
            const before = record.balanceBefore;
            const after  = record.balanceAfter;
            const color  = v => v < 0 ? 'var(--danger)' : v > 0 ? 'var(--success)' : 'var(--text-secondary)';
            const label  = v => v < 0 ? 'pendiente' : v > 0 ? 'a favor' : 'saldo cero';
            const amt    = parseFloat(record.type === 'work' ? record.total : record.amount) || 0;
            const fmt    = v => formatCurrency(Math.abs(v));

            const tip = `Antes: ${fmt(before)} ${label(before)} · ${record.type === 'work' ? 'Este trabajo' : 'Este pago'}: ${formatCurrency(amt)} · Después: ${fmt(after)} ${label(after)}`;

            return `<span class="hr-balance" title="${tip}">
                        <span style="color:${color(before)}">${fmt(before)}</span>
                        <span class="balance-op">→</span>
                        <strong style="color:${color(after)}">${fmt(after)}</strong>
                        <span class="hr-balance-label" style="color:${color(after)}">${label(after)}</span>
                    </span>`;
        }

        // Edición de registros
        let editingRecordId = null;

        function openEditModal(id) {
            const record = records.find(r => r.id === id);
            if (!record) return;
            editingRecordId = id;

            const el = document.getElementById(`hi-${id}`);
            if (!el) return;

            const serviceOptions = services.map(s =>
                `<option value="${s.name}" ${s.name === record.service ? 'selected' : ''}>${s.name}</option>`
            ).join('');

            const isWork = record.type === 'work';
            const extraFields = isWork ? `
                <div class="form-group">
                    <label>Horas</label>
                    <input type="number" id="editHours" step="0.5" min="0.5" value="${record.hours}">
                </div>
                <div class="form-group">
                    <label>Tarifa (€/h)</label>
                    <input type="number" id="editRate" step="0.5" min="0" value="${record.rate}">
                </div>
            ` : `
                <div class="form-group">
                    <label>Cantidad (€)</label>
                    <input type="number" id="editAmount" step="0.01" min="0" value="${record.amount}">
                </div>
                <div class="form-group"></div>
            `;

            el.classList.add('editing');
            el.innerHTML = `
                <div class="inline-edit-title">Editando registro — ${formatDate(record.date)} · ${record.service}</div>
                <div class="inline-edit-fields">
                    <div class="form-group">
                        <label>Servicio</label>
                        <select id="editService">${serviceOptions}</select>
                    </div>
                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date" id="editDate" value="${record.date}">
                    </div>
                    ${extraFields}
                    <div class="form-group full">
                        <label>Notas</label>
                        <input type="text" id="editNotes" value="${record.notes || ''}" placeholder="Opcional">
                    </div>
                </div>
                <div class="inline-edit-actions">
                    <button onclick="closeEditModal()" class="btn btn-small">Cancelar</button>
                    <button onclick="saveEditRecord()" class="btn btn-primary btn-small">Guardar cambios</button>
                </div>
            `;

            el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function closeEditModal() {
            editingRecordId = null;
            renderHistory();
        }

        async function saveEditRecord() {
            if (!editingRecordId) return;
            const record = records.find(r => r.id === editingRecordId);
            if (!record) return;

            const data = {
                service: document.getElementById('editService').value,
                date: document.getElementById('editDate').value,
                notes: document.getElementById('editNotes').value
            };

            if (record.type === 'work') {
                data.hours = parseFloat(document.getElementById('editHours').value);
                data.rate = parseFloat(document.getElementById('editRate').value);
            } else {
                data.amount = parseFloat(document.getElementById('editAmount').value);
            }

            try {
                const response = await fetch(`${API_BASE}?path=record/${editingRecordId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                const result = await response.json();

                if (result.success) {
                    closeEditModal();
                    showAlert('Registro actualizado correctamente', 'success');
                    loadData();
                } else {
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert(App.t('alerts.connection_error'), 'error');
            }
        }

        async function deleteRecord(id) {
            if (!confirm('¿Eliminar este registro? Esta acción no se puede deshacer.')) return;
            try {
                const response = await fetch(`${API_BASE}?path=record/${id}`, { method: 'DELETE' });
                const result = await response.json();
                if (result.success) {
                    showAlert('Registro eliminado', 'success');
                    loadData();
                } else {
                    showAlert('Error: ' + result.error, 'error');
                }
            } catch (error) {
                showAlert(App.t('alerts.connection_error'), 'error');
            }
        }

        // Renderizar gráfico: barras agrupadas Trabajado (rojo) vs Pagado (verde), acumulados,
        // con la diferencia marcada en discontinuo sobre la barra más baja, y línea de horas como tendencia.
        function renderChart() {
            const canvas = document.getElementById('balanceChart');
            const ctx = canvas.getContext('2d');

            const all = (currentChartService === 'all'
                ? [...records]
                : records.filter(r => r.service === currentChartService)
            ).sort((a, b) => {
                const d = new Date(a.date) - new Date(b.date);
                return d !== 0 ? d : new Date(a.created_at) - new Date(b.created_at);
            });

            // Inicio del período
            let cutoff = null;
            if (currentChartPeriod === 'month') {
                const now = new Date();
                cutoff = new Date(now.getFullYear(), now.getMonth(), 1);
            } else if (currentChartPeriod !== 'all') {
                const days = { '1m': 30, '3m': 90, '6m': 180 }[currentChartPeriod];
                cutoff = new Date();
                cutoff.setDate(cutoff.getDate() - days);
                cutoff.setHours(0, 0, 0, 0);
            }
            const cutoffISO = cutoff ? localISODate(cutoff) : null;

            if (balanceChart) { balanceChart.destroy(); balanceChart = null; }

            // Saldo previo al período: se suma a la barra que corresponda para que
            // Pagado − Trabajado sea SIEMPRE el saldo real (no empieza en 0 al filtrar).
            let carry = 0;
            const inPeriod = [];
            all.forEach(r => {
                if (cutoffISO && r.date < cutoffISO) {
                    carry += r.type === 'work' ? -(parseFloat(r.total) || 0) : (parseFloat(r.amount) || 0);
                } else {
                    inPeriod.push(r);
                }
            });
            carry = Math.round(carry * 100) / 100;
            if (inPeriod.length === 0 && carry === 0) return;

            // Agrupación según la amplitud del rango: día (≤45d), semana (≤200d) o mes
            const firstISO = cutoffISO || inPeriod[0].date;
            const spanDays = (new Date() - new Date(firstISO + 'T00:00:00')) / 86400000;
            const unit = spanDays <= 45 ? 'day' : spanDays <= 200 ? 'week' : 'month';
            const bucketOf = iso => {
                const d = new Date(iso + 'T00:00:00');
                if (unit === 'week') d.setDate(d.getDate() - ((d.getDay() + 6) % 7)); // lunes
                if (unit === 'month') d.setDate(1);
                return localISODate(d);
            };

            let worked = carry < 0 ? -carry : 0;   // deuda previa cuenta como trabajado pendiente
            let paid   = carry > 0 ?  carry : 0;   // crédito previo cuenta como pagado
            let hours  = 0;
            const buckets = new Map();
            if (cutoffISO) buckets.set(bucketOf(cutoffISO), { worked, paid, hours });
            inPeriod.forEach(r => {
                if (r.type === 'work') {
                    worked += parseFloat(r.total) || 0;
                    hours  += parseFloat(r.hours) || 0;
                } else {
                    paid += parseFloat(r.amount) || 0;
                }
                buckets.set(bucketOf(r.date), { worked, paid, hours });
            });
            const r2 = v => Math.round(v * 100) / 100;
            const points = [...buckets.entries()].map(([date, v]) => ({
                date, worked: r2(v.worked), paid: r2(v.paid), hours: r2(v.hours), diff: r2(v.paid - v.worked)
            }));

            const cs = getComputedStyle(document.documentElement);
            const css = n => cs.getPropertyValue(n).trim();
            const secondary = css('--secondary');
            const danger    = css('--danger');
            const success   = css('--success');
            const textSec   = css('--text-secondary');
            const gridColor = css('--border') || 'rgba(0,0,0,0.07)';
            const fontFam   = getComputedStyle(document.body).fontFamily;
            const tickFont  = { size: 12, family: fontFam };

            const toRgba = (hex, a) => {
                const r = parseInt(hex.substr(1,2),16);
                const g = parseInt(hex.substr(3,2),16);
                const b = parseInt(hex.substr(5,2),16);
                return `rgba(${r},${g},${b},${a})`;
            };

            const lineFill = (context) => {
                const { ctx: c, chartArea } = context.chart;
                if (!chartArea) return 'transparent';
                const g = c.createLinearGradient(0, chartArea.top, 0, chartArea.bottom);
                g.addColorStop(0, toRgba(secondary, 0.14));
                g.addColorStop(1, toRgba(secondary, 0));
                return g;
            };

            // Plugin: sobre la barra más baja, rectángulo discontinuo hasta la altura de la alta + diferencia
            const diffPlugin = {
                id: 'diffMarker',
                afterDatasetsDraw(chart) {
                    const mW = chart.getDatasetMeta(0), mP = chart.getDatasetMeta(1);
                    if (mW.hidden || mP.hidden) return;
                    const c = chart.ctx;
                    points.forEach((p, i) => {
                        const bw = mW.data[i], bp = mP.data[i];
                        if (!bw || !bp || p.diff === 0) return;
                        const low  = p.paid < p.worked ? bp : bw;   // barra más baja
                        const high = p.paid < p.worked ? bw : bp;
                        const color = p.diff > 0 ? success : danger;
                        const w = low.width;
                        const x0 = low.x - w / 2;
                        c.save();
                        c.setLineDash([4, 3]);
                        c.lineWidth = 1.5;
                        c.strokeStyle = color;
                        c.fillStyle = toRgba(color, 0.08);
                        c.fillRect(x0, high.y, w, low.y - high.y);
                        c.strokeRect(x0 + 0.75, high.y, w - 1.5, low.y - high.y);
                        c.setLineDash([]);
                        if (w >= 16) {
                            const txt = (p.diff > 0 ? '+' : '−') + formatCurrency(Math.abs(p.diff)).replace(' €', '€');
                            c.font = `600 ${w >= 34 ? 11 : 9}px ${fontFam}`;
                            c.fillStyle = color;
                            c.textAlign = 'center';
                            c.textBaseline = 'bottom';
                            c.fillText(txt, low.x, high.y - 4);
                        }
                        c.restore();
                    });
                }
            };

            const barCommon = {
                type: 'bar',
                yAxisID: 'y',
                borderWidth: 0,
                borderRadius: 0,
                barPercentage: 1.0,
                categoryPercentage: 0.62,
                maxBarThickness: 48,
                pointStyle: 'rect',
                order: 2
            };

            balanceChart = new Chart(ctx, {
                plugins: [diffPlugin],
                data: {
                    datasets: [
                        { ...barCommon, label: 'Trabajado (€)', data: points.map(p => ({ x: p.date, y: p.worked })),
                          backgroundColor: toRgba(danger, 0.82), hoverBackgroundColor: danger },
                        { ...barCommon, label: 'Pagado (€)', data: points.map(p => ({ x: p.date, y: p.paid })),
                          backgroundColor: toRgba(success, 0.82), hoverBackgroundColor: success },
                        {
                            type: 'line',
                            label: 'Horas acumuladas',
                            data: points.map(p => ({ x: p.date, y: p.hours })),
                            yAxisID: 'y1',
                            order: 1,
                            borderColor: secondary,
                            borderWidth: 2.5,
                            backgroundColor: lineFill,
                            fill: 'origin',
                            tension: 0.4,
                            cubicInterpolationMode: 'monotone',
                            pointRadius: 0,
                            pointHoverRadius: 5,
                            pointHitRadius: 12,
                            pointBackgroundColor: secondary,
                            pointBorderColor: '#fff',
                            pointBorderWidth: 2,
                            pointStyle: 'circle'
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    layout: { padding: { top: 18 } },
                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            align: 'end',
                            labels: {
                                usePointStyle: true,
                                boxWidth: 10, boxHeight: 10,
                                padding: 16,
                                color: textSec,
                                font: { size: 13, family: fontFam }
                            }
                        },
                        tooltip: {
                            backgroundColor: 'rgba(0,0,0,0.8)',
                            padding: 12,
                            cornerRadius: 8,
                            usePointStyle: true,
                            titleFont: { size: 13, weight: 'bold' },
                            bodyFont: { size: 12 },
                            footerFont: { size: 12, weight: 'bold' },
                            callbacks: {
                                title(items) {
                                    if (!items.length) return '';
                                    const d = items[0].raw.x;
                                    if (unit === 'week')  return 'Semana del ' + formatDate(d);
                                    if (unit === 'month') return 'Mes ' + formatDate(d).slice(3);
                                    return formatDate(d);
                                },
                                label(c) {
                                    if (c.dataset.yAxisID === 'y1') return ` Horas: ${c.parsed.y.toFixed(1)}h`;
                                    return ` ${c.dataset.label.replace(' (€)', '')}: ${formatCurrency(c.parsed.y)}`;
                                },
                                footer(items) {
                                    if (!items.length) return '';
                                    const d = points[items[0].dataIndex].diff;
                                    if (d === 0) return 'Saldo cero';
                                    return `Diferencia: ${d > 0 ? '+' : '−'}${formatCurrency(Math.abs(d))} · ${d > 0 ? 'a tu favor' : 'pendiente de pagar'}`;
                                }
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'time',
                            offset: true,
                            time: { unit, displayFormats: { day: 'dd/MM', week: 'dd/MM', month: 'MM/yyyy' } },
                            grid: { display: false },
                            border: { display: false },
                            ticks: { maxTicksLimit: 10, color: textSec, font: tickFont, padding: 8 }
                        },
                        y: {
                            position: 'left',
                            beginAtZero: true,
                            grace: '8%',
                            grid: { color: gridColor, drawTicks: false },
                            border: { display: false, dash: [4, 4] },
                            ticks: { callback: v => formatCurrency(v), color: textSec, font: tickFont, padding: 10, maxTicksLimit: 6 }
                        },
                        y1: {
                            position: 'right',
                            beginAtZero: true,
                            grid: { display: false },
                            border: { display: false },
                            ticks: { callback: v => v.toFixed(0) + 'h', color: textSec, font: tickFont, padding: 10, maxTicksLimit: 6 }
                        }
                    }
                }
            });
        }

        // ── Filtro de fechas ──────────────────────────────────────
        function setHistoryPreset(months) {
            document.getElementById('historyDateFrom').value = localISODate(monthsAgo(months));
            document.getElementById('historyDateTo').value = '';
            renderHistory();
        }

        // "Ver todos": quita fechas y el filtro de servicio/tipo
        function clearAllHistoryFilters() {
            currentFilter = 'all';
            document.querySelectorAll('[data-filter]').forEach(b => b.classList.toggle('active', b.dataset.filter === 'all'));
            clearDateFilter();
        }

        function clearDateFilter() {
            document.getElementById('historyDateFrom').value = '';
            document.getElementById('historyDateTo').value = '';
            renderHistory();
        }

        // ── Resumen mensual ───────────────────────────────────────
        function renderSummaryServiceButtons() {
            const container = document.getElementById('summaryServiceSelector');
            if (!container) return;
            container.innerHTML =
                `<button class="service-btn ${currentSummaryService === 'all' ? 'active' : ''}" data-summary-service="all">Todos</button>` +
                services.map(s => `<button class="service-btn ${currentSummaryService === s.name ? 'active' : ''}" data-summary-service="${escapeHtml(s.name)}">${escapeHtml(s.name)}</button>`).join('');
            container.querySelectorAll('[data-summary-service]').forEach(btn => {
                btn.addEventListener('click', () => {
                    container.querySelectorAll('[data-summary-service]').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentSummaryService = btn.dataset.summaryService;
                    renderMonthlySummary();
                });
            });
        }

        function setSummaryPreset(months) {
            document.getElementById('summaryDateFrom').value = localISODate(summaryPresetStart(months));
            document.getElementById('summaryDateTo').value = '';
            renderMonthlySummary();
        }

        function clearAllSummaryFilters() {
            currentSummaryService = 'all';
            document.querySelectorAll('[data-summary-service]').forEach(b => b.classList.toggle('active', b.dataset.summaryService === 'all'));
            document.getElementById('summaryDateFrom').value = '';
            document.getElementById('summaryDateTo').value = '';
            renderMonthlySummary();
        }

        function renderMonthlySummary() {
            const container = document.getElementById('monthlySummaryContainer');
            if (!container) return;

            let filtered = currentSummaryService === 'all' ? records
                : records.filter(r => r.service === currentSummaryService);

            const allMonths = new Set(filtered.map(r => r.date.substring(0, 7))).size;
            const dateFrom = document.getElementById('summaryDateFrom')?.value;
            const dateTo   = document.getElementById('summaryDateTo')?.value;
            if (dateFrom) filtered = filtered.filter(r => r.date >= dateFrom);
            if (dateTo)   filtered = filtered.filter(r => r.date <= dateTo);
            const shownMonths = new Set(filtered.map(r => r.date.substring(0, 7))).size;

            document.querySelectorAll('#summaryPresets [data-months]').forEach(btn => {
                const n = parseInt(btn.dataset.months, 10);
                btn.classList.toggle('active', !dateTo && dateFrom === localISODate(summaryPresetStart(n)));
            });
            const countEl = document.getElementById('summaryCount');
            if (countEl) {
                countEl.innerHTML = (dateFrom || dateTo) && shownMonths < allMonths
                    ? `<span>${shownMonths} de ${allMonths} meses</span>`
                    : `<span>${shownMonths} meses</span>`;
                if (dateFrom || dateTo || currentSummaryService !== 'all') {
                    countEl.innerHTML += `<button class="service-btn" onclick="clearAllSummaryFilters()" title="Quitar todos los filtros"><iconify-icon icon="mdi:eye-outline" width="14" height="14"></iconify-icon> Ver todos</button>`;
                }
            }

            if (filtered.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-state-icon"><iconify-icon icon="mdi:inbox-outline" width="48" height="48"></iconify-icon></div><p>${App.t('history.empty')}</p></div>`;
                return;
            }
            const showWork = true, showPay = true, showBal = true;

            const months = {};
            filtered.forEach(r => {
                const key = r.date.substring(0, 7);
                if (!months[key]) months[key] = { hours: 0, cost: 0, paid: 0 };
                if (r.type === 'work') {
                    months[key].hours += parseFloat(r.hours) || 0;
                    months[key].cost  += parseFloat(r.total) || 0;
                } else {
                    months[key].paid += parseFloat(r.amount) || 0;
                }
            });

            const sorted = Object.entries(months).sort((a, b) => b[0].localeCompare(a[0]));

            const monthName = key => {
                const [y, m] = key.split('-');
                return new Date(y, m - 1, 1).toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });
            };

            const balColor = v => v < 0 ? 'var(--danger)' : v > 0 ? 'var(--success)' : 'var(--text-secondary)';

            let totalH = 0, totalC = 0, totalP = 0;
            const rows = sorted.map(([key, d]) => {
                const bal = d.paid - d.cost;
                totalH += d.hours; totalC += d.cost; totalP += d.paid;
                return `<tr>
                    <td class="month-name">${monthName(key)}</td>
                    ${showWork ? `<td>${d.hours > 0 ? d.hours.toFixed(1) + 'h' : '—'}</td>
                    <td>${d.cost > 0 ? formatCurrency(d.cost) : '—'}</td>` : ''}
                    ${showPay ? `<td>${d.paid > 0 ? formatCurrency(d.paid) : '—'}</td>` : ''}
                    ${showBal ? `<td style="color:${balColor(bal)}; font-weight:600;">${formatCurrency(bal)}</td>` : ''}
                </tr>`;
            }).join('');

            const totalBal = totalP - totalC;
            container.innerHTML = `
                <div class="monthly-table-wrap"><table class="monthly-table">
                    <thead>
                        <tr>
                            <th>Mes</th>
                            ${showWork ? '<th>Horas</th><th>Trabajado</th>' : ''}
                            ${showPay ? '<th>Pagado</th>' : ''}
                            ${showBal ? '<th>Balance</th>' : ''}
                        </tr>
                    </thead>
                    <tbody>${rows}</tbody>
                    <tfoot>
                        <tr>
                            <td>Total</td>
                            ${showWork ? `<td>${totalH.toFixed(1)}h</td><td>${formatCurrency(totalC)}</td>` : ''}
                            ${showPay ? `<td>${formatCurrency(totalP)}</td>` : ''}
                            ${showBal ? `<td style="color:${balColor(totalBal)}">${formatCurrency(totalBal)}</td>` : ''}
                        </tr>
                    </tfoot>
                </table></div>`;
        }

        // ── Compartir resumen ─────────────────────────────────────
        function shareResumen() {
            const { balance, totalWorked, totalPaid, totalHours } = calculateBalance();
            const now = new Date().toLocaleDateString('es-ES', { month: 'long', year: 'numeric' });

            let text = `📊 Gestión de Pagos — ${now}\n\n`;
            text += `⏱ Horas trabajadas: ${totalHours.toFixed(1)}h\n`;
            text += `💼 Total trabajado: ${totalWorked.toFixed(2).replace('.', ',')} €\n`;
            text += `✅ Total pagado: ${totalPaid.toFixed(2).replace('.', ',')} €\n`;
            if (balance < 0) {
                text += `⚠️ Pendiente de pago: ${Math.abs(balance).toFixed(2).replace('.', ',')} €`;
            } else if (balance > 0) {
                text += `💚 A tu favor: ${balance.toFixed(2).replace('.', ',')} €`;
            } else {
                text += `✅ Todo al día`;
            }

            copyToClipboard(text);
        }

        function copyToClipboard(text) {
            const ta = document.createElement('textarea');
            ta.value = text;
            ta.style.cssText = 'position:fixed;top:-999px;left:-999px;opacity:0;';
            document.body.appendChild(ta);
            ta.focus();
            ta.select();
            try {
                document.execCommand('copy');
                showAlert('✓ Resumen copiado al portapapeles', 'success');
            } catch {
                showShareModal(text);
            }
            document.body.removeChild(ta);
        }

        function showShareModal(text) {
            // Elimina modal previo si existe
            document.getElementById('shareModal')?.remove();

            const modal = document.createElement('div');
            modal.id = 'shareModal';
            modal.style.cssText = `
                position:fixed; inset:0; background:rgba(0,0,0,0.5);
                display:flex; align-items:center; justify-content:center;
                z-index:9999; padding:1rem;
            `;
            modal.innerHTML = `
                <div style="background:var(--bg-card); border-radius:16px; padding:1.5rem;
                            max-width:480px; width:100%; box-shadow:var(--shadow-hover);">
                    <div style="font-weight:700; margin-bottom:1rem; font-size:1rem;">
                        📋 Resumen — copia y pega
                    </div>
                    <textarea readonly style="width:100%; height:160px; resize:none;
                        font-family:monospace; font-size:0.85rem; padding:0.75rem;
                        border-radius:10px; border:1.5px solid var(--border);
                        background:var(--inner-bg); color:var(--text-primary);"
                    >${text}</textarea>
                    <div style="display:flex; justify-content:flex-end; gap:0.5rem; margin-top:1rem;">
                        <button onclick="document.getElementById('shareModal').remove()"
                            class="btn btn-small">Cerrar</button>
                    </div>
                </div>`;
            modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
            document.body.appendChild(modal);
            modal.querySelector('textarea').select();
        }

        // Exportar a CSV
        function exportToCSV() {
            if (records.length === 0) {
                showAlert(App.t('alerts.no_data_export'), 'warning');
                return;
            }

            // Crear CSV con headers traducidos
            let csv = `${App.t('csv.type')},${App.t('csv.service')},${App.t('csv.date')},${App.t('csv.hours')},${App.t('csv.rate')},${App.t('csv.total_worked')},${App.t('csv.amount_paid')},${App.t('csv.notes')}\n`;

            records.forEach(record => {
                const tipo = record.type === 'work' ? App.t('csv.work') : App.t('csv.payment');
                const servicio = record.service;
                const fecha = record.date;
                const horas = record.hours || '';
                const tarifa = record.rate || '';
                const total = record.total || '';
                const cantidad = record.amount || '';
                const notas = (record.notes || '').replace(/,/g, ';');

                csv += `${tipo},${servicio},${fecha},${horas},${tarifa},${total},${cantidad},"${notas}"\n`;
            });

            // Crear blob y descargar
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            const url = URL.createObjectURL(blob);

            const fecha = new Date().toISOString().split('T')[0];
            link.setAttribute('href', url);
            link.setAttribute('download', `gestion-pagos-${fecha}.csv`);
            link.style.visibility = 'hidden';

            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);

            showAlert(App.t('alerts.csv_exported'), 'success');
        }

        // Funciones auxiliares
        function formatCurrency(amount) {
            return amount.toFixed(2).replace('.', ',') + ' €';
        }

        function formatDate(dateStr) {
            const date = new Date(dateStr + 'T00:00:00');
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function showAlert(message, type) {
            const existingAlerts = document.querySelectorAll('.alert-success, .alert-error');
            existingAlerts.forEach(a => a.remove());

            const alert = document.createElement('div');
            alert.className = `alert alert-${type} animate-in`;
            alert.textContent = message;

            const container = document.querySelector('.container');
            container.insertBefore(alert, container.children[2]);

            setTimeout(() => {
                alert.remove();
            }, 4000);
        }
    </script>
</body>
</html>
